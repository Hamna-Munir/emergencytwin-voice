<svg viewBox="0 0 1600 560" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#0F1B2E"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fire" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="560" fill="url(#bg)"/>
  <circle cx="1200" cy="280" r="380" fill="url(#glow)"/>

  <!-- ============ LEFT: TEXT ============ -->
  <g>
    <rect x="96" y="150" width="56" height="5" rx="2.5" fill="#2DD4BF"/>

    <text x="96" y="235" fill="#F8FAFC" font-size="68" font-weight="800" letter-spacing="-1">EmergencyTwin <tspan fill="#2DD4BF">AI</tspan></text>

    <text x="96" y="296" fill="#CBD5E1" font-size="28" font-weight="500">Talk to the building. It talks back.</text>

    <text x="96" y="352" fill="#7C8CA3" font-size="18" font-weight="400" letter-spacing="0.4">3D DIGITAL TWIN  ·  LIVE EVACUATION ROUTING  ·  VOICE AGENT</text>

    <!-- small badge -->
    <rect x="96" y="398" width="330" height="36" rx="18" fill="none" stroke="#2DD4BF" stroke-opacity="0.5" stroke-width="1.2"/>
    <circle cx="118" cy="416" r="4.5" fill="#2DD4BF"/>
    <text x="134" y="421" fill="#A7F3E8" font-size="14" font-weight="600" letter-spacing="0.3">Built for AssemblyAI Voice Agent Hackathon</text>
  </g>

  <!-- ============ RIGHT: BUILDING ============ -->
  <g transform="translate(900,90)">
    <!-- Floor 3 -->
    <g>
      <polygon points="160,110 560,110 560,128 160,128" fill="#1E3A5F"/>
      <polygon points="60,60 460,60 560,110 160,110" fill="#3B82F6" fill-opacity="0.35" stroke="#60A5FA" stroke-opacity="0.8" stroke-width="1.2"/>
      <rect x="130" y="74" width="60" height="16" rx="2" fill="#93C5FD" fill-opacity="0.35"/>
      <rect x="220" y="82" width="60" height="16" rx="2" fill="#93C5FD" fill-opacity="0.25"/>
    </g>

    <!-- Floor 2 (fire) -->
    <g transform="translate(0,100)">
      <polygon points="160,110 560,110 560,128 160,128" fill="#5B1F1F"/>
      <polygon points="60,60 460,60 560,110 160,110" fill="#EF4444" fill-opacity="0.32" stroke="#F87171" stroke-width="1.2"/>
      <circle cx="330" cy="86" r="36" fill="url(#fire)"/>
      <path d="M330,68 C321,79 317,86 323,95 C326,100 334,100 337,95 C340,91 338,87 336,88 C339,81 336,74 330,68 Z" fill="#FB923C"/>
      <path d="M330,77 C326,83 325,88 328,92 C329,94 333,94 334,92 C335,89 333,88 332,89 C334,85 332,81 330,77 Z" fill="#FDE68A"/>
    </g>

    <!-- Floor 1 -->
    <g transform="translate(0,200)">
      <polygon points="160,110 560,110 560,128 160,128" fill="#0F3D3A"/>
      <polygon points="60,60 460,60 560,110 160,110" fill="#14B8A6" fill-opacity="0.3" stroke="#2DD4BF" stroke-opacity="0.85" stroke-width="1.2"/>
      <rect x="130" y="74" width="70" height="16" rx="2" fill="#5EEAD4" fill-opacity="0.3"/>
      <rect x="230" y="82" width="60" height="16" rx="2" fill="#5EEAD4" fill-opacity="0.2"/>
    </g>

    <!-- evacuation route -->
    <path d="M 290 86 C 210 100, 110 112, 110 175 C 110 240, 130 270, 210 288 C 300 306, 380 300, 430 288"
          fill="none" stroke="#2DD4BF" stroke-opacity="0.25" stroke-width="10" stroke-linecap="round"/>
    <path d="M 290 86 C 210 100, 110 112, 110 175 C 110 240, 130 270, 210 288 C 300 306, 380 300, 430 288"
          fill="none" stroke="url(#route)" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 10"/>
    <circle cx="290" cy="86" r="7" fill="#F8FAFC"/>

    <!-- exit -->
    <circle cx="430" cy="288" r="18" fill="none" stroke="#34D399" stroke-opacity="0.5" stroke-width="1.5"/>
    <circle cx="430" cy="288" r="9" fill="#34D399"/>

    <!-- occupant dots -->
    <circle cx="118" cy="150" r="5" fill="#F8FAFC"/>
    <circle cx="125" cy="240" r="5" fill="#F8FAFC"/>
    <circle cx="300" cy="300" r="5" fill="#F8FAFC"/>
  </g>
</svg>
